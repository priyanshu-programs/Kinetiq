[pytest]
testpaths = tests
# The console-script `pytest` does not put the rundir on sys.path the way
# `python -m pytest` does, so conftest.py could not import `app` in CI.
pythonpath = .
addopts = --cov=app --cov-report=term-missing
markers =
    postgres: requires TEST_DATABASE_URL pointing at a live PostgreSQL
